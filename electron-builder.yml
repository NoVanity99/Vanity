appId: com.vanity.launcher
productName: Vanity
directories:
  buildResources: resources
files:
  - "out/**/*"
  - "resources/**"
  - "package.json"
npmRebuild: false
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "resources/**"
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
