# Windows installer and auto-update settings. See RELEASING.md for how releases are shipped.
appId: com.vanity.launcher
productName: Vanity
copyright: Copyright © 2026 NoVanity99
directories:
  buildResources: resources
  output: dist
files:
  - "out/**/*"
  - "resources/**"
  - "package.json"
  - "!resources/icon.svg"
# better-sqlite3 ships prebuilt binaries (prebuilds/win32-x64.node), so nothing is compiled.
npmRebuild: false
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "resources/**"

win:
  target:
    - target: nsis
      arch: [x64]
  # Replace resources/icon.ico (256x256 or larger, multi-size) to change the app and installer icon.
  icon: resources/icon.ico
  # Shown in the exe's Properties → Details.
  legalTrademarks: Vanity

nsis:
  # A normal "Next, Next, Install" wizard that lets you pick the folder.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Vanity
  uninstallDisplayName: Vanity
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  # Your library, settings and artwork live in %APPDATA%\Vanity and are kept when uninstalling.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: Vanity-Setup-${version}.${ext}

# Where installed copies look for updates (electron-updater) and where CI publishes.
publish:
  provider: github
  owner: NoVanity99
  repo: Vanity
  releaseType: release
