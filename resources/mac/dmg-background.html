<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- The background of the Mac installer window (660 x 400). Rendered to background.png and
     background@2x.png by scripts/make-mac-assets.mjs. The two icons are placed by electron-builder
     at x 180 and x 480, y 200 (dmg.contents in electron-builder.yml). -->
<style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(420px 260px at 18% 0%, rgba(255, 71, 71, 0.28), transparent 70%),
      radial-gradient(380px 240px at 100% 100%, rgba(190, 18, 60, 0.22), transparent 70%),
      linear-gradient(160deg, #141822 0%, #0b0d12 60%, #0b0d12 100%);
    color: #e8ebf1;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse at 50% 40%, black 30%, transparent 75%);
  }
  h1 { position: absolute; top: 34px; left: 0; right: 0; margin: 0; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: -0.2px; }
  h1 span { color: #ff5a5a; }
  p { position: absolute; top: 68px; left: 0; right: 0; margin: 0; text-align: center; font-size: 13px; color: #8a91a0; }
  .arrow { position: absolute; left: 266px; top: 184px; width: 128px; height: 32px; }
  .foot { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 11px; color: #5d6473; }
</style>
</head>
<body>
  <div class="grid"></div>
  <h1>Install <span>Vanity</span></h1>
  <p>Drag Vanity onto the Applications folder.</p>
  <svg class="arrow" viewBox="0 0 128 32" fill="none">
    <defs>
      <linearGradient id="a" gradientUnits="userSpaceOnUse" x1="8" y1="0" x2="112" y2="0"><stop offset="0" stop-color="#ff5a5a" stop-opacity="0.25"/><stop offset="1" stop-color="#ff5a5a"/></linearGradient>
    </defs>
    <path d="M8 16 H112" stroke="url(#a)" stroke-width="4" stroke-linecap="round"/>
    <path d="M104 6 L118 16 L104 26" stroke="#ff5a5a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="foot">First time opening it? Right-click Vanity in Applications and choose Open.</div>
</body>
</html>
